[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-ml-platform"
version = "1.0.0"
description = "Explainable A-share cross-sectional factor research and execution-aware backtesting platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
]

[project.optional-dependencies]
data = ["akshare>=1.16", "baostock>=0.8", "pyarrow>=18.0"]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
ashare-quant = "ashare_quant.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb"]
